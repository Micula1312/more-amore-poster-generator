name: Fix partner logo plane

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch partner logo plane and default placement
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace("const PARTNER_BOTTOM_MARGIN = 58;", "const PARTNER_BOTTOM_MARGIN = 92;")
          s = s.replace("const PARTNER_RIGHT_MARGIN = 58;", "const PARTNER_RIGHT_MARGIN = 86;")
          s = s.replace("const PARTNER_GAP = 18;", "const PARTNER_GAP = 22;\nconst PARTNER_PLANE_Z = -145;")
          s = s.replace("if(state.group) state.group.position.set(state.x,state.y,120);", "if(state.group) state.group.position.set(state.x,state.y,PARTNER_PLANE_Z);")

          # Make the two default slots slightly more compact and guaranteed to fit.
          s = s.replace("{ group:null, texture:null, width:150, height:84, x:0, y:0 },\n  { group:null, texture:null, width:150, height:84, x:0, y:0 }", "{ group:null, texture:null, width:132, height:74, x:0, y:0 },\n  { group:null, texture:null, width:132, height:74, x:0, y:0 }")
          s = s.replace("loadImageAsTexture(file,150,84,({texture,width,height})=>{", "loadImageAsTexture(file,132,74,({texture,width,height})=>{")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet || git commit -m "Fix partner logos inside poster canvas"
          git push
