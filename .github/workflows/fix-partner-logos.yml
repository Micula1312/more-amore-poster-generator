name: Fix partner logo layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch partner logo positioning
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.js')
          s = p.read_text(encoding='utf-8')

          old = """// Keep these clearly inside the perspective-safe part of the poster.\nconst partnerStates = [\n  { group:null, texture:null, width:115, height:64, x:300, y:-515 },\n  { group:null, texture:null, width:115, height:64, x:425, y:-515 }\n];\n\nfunction buildPartnerLogo(index){\n  const state = partnerStates[index];\n  if(!state.texture) return;\n  disposeGroup(state.group);\n  const group = new THREE.Group();\n  const mesh = new THREE.Mesh(\n    new THREE.PlaneGeometry(state.width,state.height),\n    new THREE.MeshBasicMaterial({\n      map:state.texture,\n      transparent:true,\n      alphaTest:.02,\n      side:THREE.DoubleSide,\n      depthTest:false\n    })\n  );\n  mesh.renderOrder = 50;\n  group.add(mesh);\n  group.position.set(state.x,state.y,80);\n  group.renderOrder = 50;\n  state.group = group;\n  scene.add(group);\n}\n"""

          new = """// Partner logos are permanently anchored inside the bottom-right safe area.\nconst PARTNER_GAP = 18;\nconst PARTNER_BOTTOM_MARGIN = 58;\nconst PARTNER_RIGHT_MARGIN = 58;\nconst partnerStates = [\n  { group:null, texture:null, width:150, height:84, x:0, y:0 },\n  { group:null, texture:null, width:150, height:84, x:0, y:0 }\n];\n\nfunction layoutPartnerLogos(){\n  const active = partnerStates.filter(state=>state.texture);\n  if(!active.length) return;\n\n  const bottomY = -HALF_H + PARTNER_BOTTOM_MARGIN;\n  let rightEdge = HALF_W - PARTNER_RIGHT_MARGIN;\n\n  for(let i=partnerStates.length-1; i>=0; i--){\n    const state = partnerStates[i];\n    if(!state.texture) continue;\n    const halfW = state.width / 2;\n    const halfH = state.height / 2;\n    state.x = rightEdge - halfW;\n    state.y = bottomY + halfH;\n    rightEdge = state.x - halfW - PARTNER_GAP;\n    if(state.group) state.group.position.set(state.x,state.y,120);\n  }\n}\n\nfunction buildPartnerLogo(index){\n  const state = partnerStates[index];\n  if(!state.texture) return;\n  disposeGroup(state.group);\n  const group = new THREE.Group();\n  const mesh = new THREE.Mesh(\n    new THREE.PlaneGeometry(state.width,state.height),\n    new THREE.MeshBasicMaterial({\n      map:state.texture,\n      transparent:true,\n      alphaTest:.01,\n      side:THREE.DoubleSide,\n      depthTest:false,\n      depthWrite:false,\n      toneMapped:false\n    })\n  );\n  mesh.renderOrder = 100;\n  group.add(mesh);\n  group.renderOrder = 100;\n  state.group = group;\n  scene.add(group);\n  layoutPartnerLogos();\n}\n"""

          if old not in s:
              raise SystemExit('partner block not found')
          s = s.replace(old, new)

          s = s.replace("loadImageAsTexture(file,115,64,({texture,width,height})=>{", "loadImageAsTexture(file,150,84,({texture,width,height})=>{")
          s = s.replace("      buildPartnerLogo(index);\n", "      buildPartnerLogo(index);\n      layoutPartnerLogos();\n")

          old2 = """  partnerStates.forEach((s,i)=>{\n    if(s.group){\n      const defaults=i===0?{x:300,y:-515}:{x:425,y:-515};\n      s.x=defaults.x;\n      s.y=defaults.y;\n      s.group.position.set(s.x,s.y,80);\n    }\n  });\n"""
          if old2 not in s:
              raise SystemExit('ensureEverythingVisible partner block not found')
          s = s.replace(old2, "  layoutPartnerLogos();\n")

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js
          git diff --cached --quiet || git commit -m "Fix partner logo positioning"
          git push
